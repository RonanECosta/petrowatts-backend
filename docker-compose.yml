services:
  db:
    build: ./banco-dados
    container_name: petrowatts-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: petrowatts_db
      MYSQL_USER: petrowatts_user
      MYSQL_PASSWORD: petrowatts_password
    ports:
      - "3306:3306"
    volumes:
      - ./banco-dados/initdb:/docker-entrypoint-initdb.d # scripts SQL para rodar a carga inicial automaticamente
      - ./banco-dados/initdb/img:/var/lib/mysql-files
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  petrowatts-api:
    build: .
    container_name: petrowatts-api
    ports:
      - "5000:5000"
    environment:
      # String de conexão configurada para o MySQL do container 'db'
      - DATABASE_URL=mysql+pymysql://petrowatts_user:petrowatts_password@db:3306/petrowatts_db
    depends_on:
      db:
        condition: service_healthy  # A API só inicia após o MySQL passar no healthcheck
    restart: unless-stopped