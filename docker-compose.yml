version: '3.8'

services:
  # Serviço do Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: petrowatts-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: petrowatts_db
      MYSQL_USER: petrowatts_user
      MYSQL_PASSWORD: petrowatts_password
    ports:
      - "3306:3306"
    volumes:
      # Mapeia os dados do MySQL para persistirem na sua máquina local
      - ./banco-dados/mysql_data:/var/lib/mysql
      # Copie os scripts SQL para a pasta ./initdb na raiz do projeto para rodar a carga inicial automaticamente
      - ./banco-dados/initdb:/docker-entrypoint-initdb.d

  # Serviço da sua API Python
  petrowatts-api:
    build: .
    container_name: petrowatts-api
    ports:
      - "5000:5000"
    environment:
      # String de conexão configurada para o MySQL do container 'db'
      - DATABASE_URL=mysql+pymysql://petrowatts_user:petrowatts_password@db:3306/petrowatts_db
    depends_on:
      - db
    restart: unless-stopped